<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join a Wandr crew</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;background:#0F1218;color:#ECEFF4;margin:0;padding:32px 16px;text-align:center}h1{font-size:28px}p{color:#8A96A3;max-width:420px;margin:12px auto}a.btn{display:inline-block;margin:10px 6px;padding:12px 20px;border-radius:12px;background:#FF8A3D;color:#000;font-weight:700;text-decoration:none}code{font-size:24px;letter-spacing:2px;color:#FFB36B}</style></head>
<body><h1>Join a Wandr crew</h1>
<p id="msg">Opening Wandr…</p>
<p>Invite code: <code id="code"></code></p>
<p><a id="open" class="btn" href="#">Open Wandr</a></p>
<p>Don't have Wandr yet? Install it, create an account, then enter the code above on the welcome screen.</p>
<p><a id="play" class="btn" href="https://play.google.com/store/apps/details?id=app.wandr.festival">Android</a> <a id="ios" class="btn" href="https://apps.apple.com/">iPhone</a></p>
<script>
var code=(new URLSearchParams(location.search).get('code')||'').toLowerCase();
document.getElementById('code').textContent=code||'(missing)';
var deep='wandr://join?code='+encodeURIComponent(code);
document.getElementById('open').href=deep;
if(code){setTimeout(function(){location.href=deep;},300);setTimeout(function(){document.getElementById('msg').textContent='If Wandr did not open, install it first.';},2500);}
</script></body></html>
